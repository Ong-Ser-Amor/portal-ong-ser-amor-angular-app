<mat-toolbar class="topbar">
  <span class="spacer"></span>
  <div class="user-profile">
    <div class="user-info">
      <h4 class="user-name">
        {{ autenticacaoService.usuarioAtual()?.nome }}
      </h4>
      <p>Voluntário</p>
    </div>
    <app-botao
      label="Sair"
      variante="stroked"
      tamanho="sm"
      (click)="logout()"
    />
  </div>
</mat-toolbar>
