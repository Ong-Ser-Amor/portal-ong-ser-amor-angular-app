<div class="container-cursos">
  <app-cabecalho-pagina titulo="Cursos">
    <app-botao label="Novo Curso" icone="add" cor="primary" (click)="adicionar()" />
  </app-cabecalho-pagina>

  @if (estaCarregando()) {
    <div class="loading-shade">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
  }

  <div class="table-container mat-elevation-z2">
    <table mat-table [dataSource]="cursos()">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let curso">{{ curso.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let curso">
          <app-botao
            variante="icon"
            icone="edit"
            cor="primary"
            (click)="editar(curso)"
          />
          <app-botao
            variante="icon"
            icone="delete"
            cor="warn"
            [desabilitado]="estaCarregando()"
            (click)="excluir(curso)"
          />
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunasExibidas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunasExibidas"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data" [attr.colspan]="colunasExibidas.length">
          Nenhum curso encontrado.
        </td>
      </tr>
    </table>
    <mat-paginator
      [length]="totalItens()"
      [pageSize]="itensPorPagina()"
      [pageIndex]="paginaAtual() - 1"
      [pageSizeOptions]="[5, 10, 25, 50]"
      (page)="mudarPagina($event)"
      aria-label="Selecione a página"
    >
    </mat-paginator>
  </div>
</div>
