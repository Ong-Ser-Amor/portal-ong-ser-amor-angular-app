<div class="voluntarios-container">
  <header class="page-header">
    <h1>Voluntários</h1>
    <app-button label="Novo Voluntário" icon="add" (click)="aoAdicionar()" />
  </header>

  @if (estaCarregando()) {
    <div class="loading-shade">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
  }

  <div class="table-container mat-elevation-z2">
    <table mat-table [dataSource]="voluntarios()">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let voluntario">
          {{ voluntario.pessoa.nome }}
        </td>
      </ng-container>

      <ng-container matColumnDef="tipoVoluntario">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let voluntario">
          <span class="badge-tipo-voluntario">
            {{ voluntario.tipoVoluntario }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="formacaoAcademica">
        <th mat-header-cell *matHeaderCellDef>Formação</th>
        <td mat-cell *matCellDef="let voluntario">
          {{ voluntario.formacaoAcademica || "—" }}
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let voluntario" class="actions-cell">
          <app-button
            variant="icon"
            icon="edit"
            color="primary"
            (click)="aoEditar(voluntario)"
          />
          <app-button
            variant="icon"
            icon="person_add"
            color="primary"
            (click)="aoCriarLogin(voluntario)"
          />
          <app-button
            variant="icon"
            icon="delete"
            color="warn"
            [disabled]="estaCarregando()"
            (click)="aoExcluir(voluntario)"
          />
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunasExibidas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunasExibidas"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data" [attr.colspan]="colunasExibidas.length">
          Nenhum voluntário encontrado.
        </td>
      </tr>
    </table>

    <mat-paginator
      [length]="totalItens()"
      [pageSize]="itensPorPagina()"
      [pageIndex]="paginaAtual()"
      [pageSizeOptions]="[5, 10, 25, 50]"
      (page)="aoMudarPagina($event)"
      aria-label="Selecione a página"
    >
    </mat-paginator>
  </div>
</div>
