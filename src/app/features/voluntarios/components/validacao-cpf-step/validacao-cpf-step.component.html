<fieldset [disabled]="carregando()" class="step-fieldset">
  <form [formGroup]="form" (ngSubmit)="aoSubmeter()" class="step-form">
    <p class="step-description">
      Informe o CPF para verificar se a pessoa já existe e se ela pode ser
      vinculada como voluntária.
    </p>

    <app-input
      formControlName="cpf"
      label="CPF"
      placeholder="000.000.000-00"
      mask="cpf"
      [required]="true"
      autocomplete="off"
    />

    @if (carregando()) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }

    @if (modoEdicao()) {
      <div class="info-banner info-banner--neutral">
        <strong>CPF carregado para edição.</strong>
        <span>Você pode avançar para revisar os dados da pessoa.</span>
      </div>
    }

    <div class="step-actions">
      <app-botao
        label="Cancelar"
        variante="stroked"
        [desabilitado]="carregando()"
        (click)="aoCancelar()"
      />
      <app-botao
        [label]="botaoTexto"
        cor="primary"
        [carregando]="carregando()"
        [desabilitado]="carregando()"
        tipo="submit"
      />
    </div>
  </form>
</fieldset>
