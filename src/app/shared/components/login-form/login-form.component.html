<fieldset
  [disabled]="carregando()"
  class="form-fieldset"
  style="border: none; padding: 0; margin: 0"
>
  <form [formGroup]="form" (ngSubmit)="aoSubmeter()" class="form-container">
    <p class="info-text">
      Digite o e-mail e a senha para que {{ nomePessoa() }} possa fazer login no
      sistema.
    </p>

    <app-input
      formControlName="email"
      label="E-mail"
      type="email"
      placeholder="email@exemplo.com"
      [required]="true"
      autocomplete="email"
    />

    <app-input
      formControlName="senha"
      label="Senha"
      type="password"
      placeholder="Mínimo 8 caracteres"
      [required]="true"
      [showPasswordToggle]="false"
    />

    <app-input
      formControlName="confirmarSenha"
      label="Confirmar Senha"
      type="password"
      placeholder="Repita a senha"
      [required]="true"
      [showPasswordToggle]="false"
    />

    <div
      class="error-message"
      *ngIf="
        form.hasError('senhasNaoIguais') && form.get('confirmarSenha')?.touched
      "
    >
      <span
        style="
          color: #f44336;
          font-size: 12px;
          margin-top: -10px;
          display: block;
        "
        >As senhas não coincidem.</span
      >
    </div>

    <div
      class="actions"
      style="
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 16px;
      "
    >
      <app-button
        label="Cancelar"
        color="basic"
        [disabled]="carregando()"
        (click)="aoCancelar()"
      />
      <app-button
        label="Criar Login"
        [loading]="carregando()"
        [disabled]="carregando()"
        type="submit"
      />
    </div>
  </form>
</fieldset>
