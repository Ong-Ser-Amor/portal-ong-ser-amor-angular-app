<header>
  <div class="area-titulo">
    <h1>{{ titulo() }}</h1>
  </div>

  <div class="area-acoes">
    @if (exibirBotaoVoltar()) {
      <app-botao
        [label]="textoVoltar()"
        icone="arrow_back"
        variante="stroked"
        [routerLink]="rotaVoltar() || null"
        (click)="clicarVoltar($event)"
      />
    }
    <ng-content></ng-content>
  </div>
</header>
